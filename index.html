<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineering Class</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base & Arrière-plan */  
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Effets de lueur en arrière-plan */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.15);
            top: 15%;
            left: 25%;
        }

        .circle-2 {
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.12);
            bottom: 20%;
            right: 25%;
        } 

        /* Conteneur Transparent */
        .welcome-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 2;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* Alignement vertical des boutons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Style commun des boutons translucides */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            padding: 15px;
            font-size: 15px;          
            font-weight: 500;
            border-radius: 10px;
            color: #ffffff;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn i {
            font-size: 16px;
        }

        /* Admin au-dessus - Teinte ardoise */
        .btn-admin {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-admin:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Student en-dessous - Teinte violet/bleu électrique */
        .btn-student {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            font-weight: 600;
        }

        .btn-student:hover {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
        }

        /* =========================================================
           MOBILE & RESPONSIVE DESIGN
           ========================================================= */
        @media screen and (max-width: 480px) {
            body {
                height: auto;
                min-height: 100vh;
                padding: 20px 16px;
                overflow-y: auto;
            } 
 
            .welcome-container {
                width: 100%;
                max-width: 100%;
                padding: 30px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 25px;
            }

            .btn {
                padding: 13px;
                font-size: 14px;
            }

            .circle-1 {
                width: 200px;
                height: 200px;
            }

            .circle-2 {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>
<body>          

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="welcome-container">
        <h1>Software Engineering class</h1>
        <p class="subtitle">Select your portal to start learning</p>
        
        <div class="button-group">
            <a href="Login_page.html" class="btn btn-admin">
                <i class="fa-solid fa-user-shield"></i> Admin Portal
            </a>
            
            <a href="Login_page.html" class="btn btn-student">
                <i class="fa-solid fa-graduation-cap"></i> Student Portal
            </a>
        </div>
    </div>

</body>
</html>
