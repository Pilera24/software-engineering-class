<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Software Engineering Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.15);
            top: 15%;
            left: 25%;
        }

        .circle-2 {
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.12);
            bottom: 20%;
            right: 25%;
        }

        .reset-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 2;
        }

        h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }

        input:focus + .input-icon {
            color: #6366f1;
        }

        .btn-reset {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }

        .login-link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: #818cf8;
            text-decoration: underline;
        }

        #statusMessage {
            font-size: 0.85rem;
            display: none;
            margin-bottom: 15px;
            text-align: left;
            border-radius: 8px;
            padding: 10px;
        }

        .message-error {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #f43f5e;
        }

        .message-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }
    </style>
</head>
<body>

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="reset-container">
        <h2>Reset Password</h2>
        <p class="subtitle" id="formSubtitle">Enter your email and new password to update your account.</p>
        
        <form id="resetPasswordForm">
            <!-- Email Field -->
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
                <i class="fa-regular fa-envelope input-icon"></i>
            </div>

            <!-- New Password Field -->
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="New Password" required>
                <i class="fa-solid fa-lock input-icon"></i>
            </div>

            <!-- Confirm New Password Field -->
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
                <i class="fa-solid fa-lock input-icon"></i>
            </div>

            <!-- Status Message Area -->
            <div id="statusMessage"></div>
            
            <button type="submit" class="btn-reset" id="submitBtn">
                <i class="fa-solid fa-key"></i> Update Password
            </button>
            
            <div class="login-link">
                Remembered your password? <a href="Login_page.html">Back to Login</a>
            </div>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://mtdpidjcpopcnnoduemd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10ZHBpZGpjcG9wY25ub2R1ZW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NDU0MDAsImV4cCI6MjA5OTQyMTQwMH0.0vrcMN-LuQV34iehWUgjiGWN7HH_ulBHSKlJ4mdtlec"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, isError = true) {
        const messageElement = document.getElementById('statusMessage');
        messageElement.innerText = text;
        messageElement.style.display = 'block';
        
        if (isError) {
            messageElement.className = 'message-error';
        } else {
            messageElement.className = 'message-success';
        }
    }

    function validatePasswords() {
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password.length < 6) {
            showMessage("Password must be at least 6 characters long.", true);
            return false;
        }

        if (password !== confirmPassword) {
            showMessage("Passwords do not match.", true);
            return false;
        }

        return true;
    }

    document.getElementById('resetPasswordForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        // 1. Validate password equality and length
        if (!validatePasswords()) {
            return;
        }

        const email = document.getElementById('email').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

        try {
            // Check if user clicked the reset link from their email
            const { data: sessionData } = await supabaseClient.auth.getSession();

            if (sessionData && sessionData.session) {
                // User is authenticated via the email reset link: update password
                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

                if (error) {
                    showMessage("Error: " + error.message, true);
                } else {
                    showMessage("Password updated successfully! Redirecting to login...", false);
                    setTimeout(() => {
                        window.location.href = 'Login_page.html';
                    }, 2000);
                }
            } else {
                // User entered email manually without clicking the email link
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.href, // Redirect back to this same page
                });

                if (error) {
                    showMessage("Error: " + error.message, true);
                } else {
                    showMessage("A verification link has been sent to your email address. Please check your inbox to confirm.", false);
                }
            }
        } catch (err) {
            showMessage("An unexpected error occurred. Please try again.", true);
            console.error(err);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-key"></i> Update Password';
        }
    });
</script>
</body>
</html>
